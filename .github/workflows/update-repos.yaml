name: Update GitHub Repos Daily

on:
  schedule:
    - cron: '0 0 * * *' # Roda uma vez por dia
  workflow_dispatch: # Permite rodar manualmente no GitHub

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar repositórios do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node update-script.js

      - name: Commit e push das alterações
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add repos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update github repos" && git push)